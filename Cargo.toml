[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/onecad-app",
    "crates/onecad-mesh-fixture",
    "crates/onecad-scene",
    "crates/onecad-render",
    "crates/onecad-interaction",
    "crates/onecad-ui",
    "crates/onecad-widgets",
    "crates/onecad-core",
    "crates/onecad-protocol",
    "crates/onecad-worker-stub",
    "crates/onecad-regen",
    "crates/onecad-kernelbench",
    "crates/onecad-library",
    "crates/onecad-library-ingest",
    "crates/onecad-embedded-worker",
    "crates/onecad-ios",
]

# Shared dependency versions for every workspace member. Individual crates
# opt into features via `{ workspace = true, features = [...] }`.
[workspace.dependencies]
# Backend features are chosen by each binary (docs/ios/KERNEL.md).
onecad-app = { path = "crates/onecad-app", default-features = false }
onecad-scene = { path = "crates/onecad-scene" }
onecad-render = { path = "crates/onecad-render" }
onecad-interaction = { path = "crates/onecad-interaction" }
onecad-ui = { path = "crates/onecad-ui" }
onecad-widgets = { path = "crates/onecad-widgets" }
onecad-core = { path = "crates/onecad-core" }
onecad-protocol = { path = "crates/onecad-protocol" }
onecad-embedded-worker = { path = "crates/onecad-embedded-worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
# Dev-observability (DEV-OBSERVABILITY wave R): `env-filter` makes `RUST_LOG`
# live, `json` backs the `logs/dev.jsonl` lane; `tracing-appender` provides the
# non-blocking writer + its flush guard.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
bytes = "1"
zip = "2"
sha2 = "0.10"

# AccessKit #835 preserves AppKit KVO subclasses during native accessibility teardown.
# Keep the adapter and its path dependencies on one source so their public types match.
[patch.crates-io]
accesskit = { git = "https://github.com/AccessKit/accesskit", rev = "64e9a47ddaac64c9082214f472fa6fcafbc86430" }
accesskit_consumer = { git = "https://github.com/AccessKit/accesskit", rev = "64e9a47ddaac64c9082214f472fa6fcafbc86430" }
accesskit_macos = { git = "https://github.com/AccessKit/accesskit", rev = "64e9a47ddaac64c9082214f472fa6fcafbc86430" }
