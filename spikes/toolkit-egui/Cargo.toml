[package]
name = "toolkit-egui"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "ONECAD-257 P0.2 toolkit spike, egui half (macOS only): wgpu MESH1 viewport, tokens.css chrome, dimension input, muda menu."

# Standalone: never captured by any enclosing workspace.
[workspace]

[lib]
name = "toolkit_egui"
crate-type = ["rlib"]

[[bin]]
name = "toolkit-egui"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
egui = "=0.37.0"
egui-wgpu = "=0.37.0"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2"
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "=0.21.2"
arboard = { version = "3.6", default-features = false }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFString", "CFCGTypes"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
