[package]
name = "mesh-fixture"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 0 spike: generate MESH1 fixtures from the real OneCAD stack (DocumentRuntime + OCCT worker)"

# Standalone: not a member of src-tauri's (or any future root) workspace.
[workspace]

[dependencies]
# The app crate (lib `onecad_lib`) gives the exact WorkerManager + DocumentRuntime
# regen/mesh path the Tauri app uses; its Tauri dep is compiled but never started.
onecad = { path = "../../src-tauri" }
onecad-core = { path = "../../src-tauri/crates/onecad-core" }
onecad-protocol = { path = "../../src-tauri/crates/onecad-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
