# P0.3 in-process OCCT worker spike (Plane ONECAD-258). STANDALONE: the empty
# [workspace] keeps it out of src-tauri's (and any future root) workspace, and
# it builds into its own ./target. Findings:
# docs/design/native-ui/inprocess-worker-spike.md
[package]
name = "inproc-worker-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
onecad-protocol = { path = "../../src-tauri/crates/onecad-protocol", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync"] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
cc = "1"
