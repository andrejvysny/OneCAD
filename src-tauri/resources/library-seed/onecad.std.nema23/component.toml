# NEMA 23 Stepper Motor — a built-in generator package (Component Library spec §2.1/§6.2).
#
# Everything but the body length is fixed by the frame: a 56.4 mm square face,
# Ø5.1 clearance holes on a 47.14 mm square, a Ø38.1 × 1.6 pilot boss and a
# Ø6.35 × 21 shaft. Body length is the one free per-instance value (spec §6.2)
# — its default here is the generator's own, and a length under `min` is
# refused by the generator rather than clamped.
#
# Geometry is produced by the worker's `nema23` generator from its own dimension
# table; this manifest declares identity, metadata and the parameter/attachment
# signature only — never a dimension.
#
# `revision` is the package content hash over every file EXCEPT this manifest
# (spec §2.1). A generator package carries no other file, so the hash is the
# SHA-256 of nothing — the same value for every seed package here, correct
# rather than coincidental, and pinned by a test in `src-tauri/src/library.rs`.

[identity]
id = "onecad.std.nema23"
version = "1.0.0"
revision = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[metadata]
name = "NEMA 23 Stepper Motor"
standard = "NEMA ICS 16"
designation = "NEMA 23 {length}mm"
category = ["motors", "steppers"]
tags = ["nema23", "stepper", "motor", "57mm", "cnc"]
unit = "mm"

[source]
kind = "generator"
generator = "nema23"
generator_version = 1

[parameters]
length = { role = "free", value = 40, min = 20 }
# Locked, fixed by the frame.
frame_square = { role = "table", from = "nema23.frame_square" }
hole_pattern = { role = "table", from = "nema23.mounting_hole_pitch" }
pilot_diameter = { role = "table", from = "nema23.pilot_diameter" }
shaft_diameter = { role = "table", from = "nema23.shaft_diameter" }

[attachments]
# The faceplate IS the seating plane: the body occupies +Z (it sits on the
# plate) while the pilot boss and shaft run -Z into the plate's pilot hole
# (see ComponentGenerators.h).
faceplate = { on = "face:faceplate", accepts = ["plane"] }
pilot_axis = { on = "cylinder:pilot", accepts = ["cylinder", "hole", "circularEdge"] }
