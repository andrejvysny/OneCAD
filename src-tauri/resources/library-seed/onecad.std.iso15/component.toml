# Deep Groove Ball Bearing — a built-in generator package (Component Library spec §2.1/§6.2).
#
# Sized by its BEARING CODE, which fully determines the boundary dimensions
# (608 = 8 × 22 × 7). Those three are all placement needs, so they are the only
# ones the table carries and the only ones the generator builds from.
#
# Geometry is produced by the worker's `iso15` generator from its own dimension
# table; this manifest declares identity, metadata and the parameter/attachment
# signature only — never a dimension. A code outside `code.domain` is refused
# loudly by the generator, never substituted (spec §0 invariant 4).
#
# `revision` is the package content hash over every file EXCEPT this manifest
# (spec §2.1). A generator package carries no other file, so the hash is the
# SHA-256 of nothing — the same value for every seed package here, correct
# rather than coincidental, and pinned by a test in `src-tauri/src/library.rs`.

[identity]
id = "onecad.std.iso15"
version = "1.0.0"
revision = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[metadata]
name = "Deep Groove Ball Bearing"
standard = "ISO 15"
designation = "Bearing {code}"
category = ["bearings"]
tags = ["bearing", "deep-groove", "ball", "metric", "608", "625"]
unit = "mm"

[source]
kind = "generator"
generator = "iso15"
generator_version = 1

[parameters]
code = { role = "free", key = "608", domain = ["625", "608", "6000", "6001", "6200", "6201", "6202", "6802"] }
# Locked, derived from the code — the ISO 15 boundary dimensions `d`/`D`/`B`.
bore = { role = "table", from = "iso15.bore" }
od = { role = "table", from = "iso15.od" }
width = { role = "table", from = "iso15.width" }

[attachments]
# The generator seats the ring's lower face at the local origin, occupying +Z
# (see ComponentGenerators.h) — a bearing sits ON the surface, like a washer.
seat = { on = "face:side", accepts = ["plane"] }
bore_axis = { on = "cylinder:bore", accepts = ["cylinder", "hole", "circularEdge"] }
