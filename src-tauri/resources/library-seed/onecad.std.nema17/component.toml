# NEMA 17 Stepper Motor — a built-in generator package (Component Library spec §2.1/§6.2).
#
# Everything but the body length is fixed by the frame: a 42.3 mm square face,
# M3 mounting holes on a 31.0 mm square, a Ø22 × 2 pilot boss and a Ø5 × 24
# shaft. Body length is the one free per-instance value (spec §6.2) — its
# default here is the generator's own, and a length under `min` is refused by
# the generator rather than clamped.
#
# Geometry is produced by the worker's `nema17` generator from its own dimension
# table; this manifest declares identity, metadata and the parameter/attachment
# signature only — never a dimension.
#
# `revision` is the package content hash over every file EXCEPT this manifest
# (spec §2.1). A generator package carries no other file, so the hash is the
# SHA-256 of nothing — the same value for every seed package here, correct
# rather than coincidental, and pinned by a test in `src-tauri/src/library.rs`.

[identity]
id = "onecad.std.nema17"
version = "1.0.0"
revision = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[metadata]
name = "NEMA 17 Stepper Motor"
standard = "NEMA ICS 16"
designation = "NEMA 17 {length}mm"
category = ["motors", "steppers"]
tags = ["nema17", "stepper", "motor", "42mm", "3d-printer"]
unit = "mm"

[source]
kind = "generator"
generator = "nema17"
generator_version = 1

[parameters]
length = { role = "free", value = 40, min = 20 }
# Locked, fixed by the frame.
frame_square = { role = "table", from = "nema17.frame_square" }
hole_pattern = { role = "table", from = "nema17.mounting_hole_pitch" }
pilot_diameter = { role = "table", from = "nema17.pilot_diameter" }
shaft_diameter = { role = "table", from = "nema17.shaft_diameter" }

[attachments]
# The faceplate IS the seating plane: the body occupies +Z (it sits on the
# plate) while the pilot boss and shaft run -Z into the plate's pilot hole
# (see ComponentGenerators.h).
faceplate = { on = "face:faceplate", accepts = ["plane"] }
pilot_axis = { on = "cylinder:pilot", accepts = ["cylinder", "hole", "circularEdge"] }
