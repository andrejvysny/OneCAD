[workspace]
resolver = "2"
members = [
    "crates/onecad-assistant-protocol",
    "crates/onecad-core",
    "crates/onecad-protocol",
    "crates/onecad-worker-stub",
    "crates/onecad-regen",
    "crates/onecad-kernelbench",
    "crates/onecad-library",
    "crates/onecad-library-ingest",
]

# Shared dependency versions for every workspace member. Individual crates
# opt into features via `{ workspace = true, features = [...] }`.
[workspace.dependencies]
onecad-core = { path = "crates/onecad-core" }
onecad-protocol = { path = "crates/onecad-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
# Dev-observability (DEV-OBSERVABILITY wave R): `env-filter` makes `RUST_LOG`
# live, `json` backs the `logs/dev.jsonl` lane; `tracing-appender` provides the
# non-blocking writer + its flush guard.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
bytes = "1"
zip = "2"
sha2 = "0.10"

[package]
name = "onecad"
version = "0.1.0"
description = "OneCAD parametric CAD application (Tauri shell + Rust core)"
authors = ["Andrej Vysny <vysnyandrej@gmail.com>"]
edition = "2021"

[features]
# Test artifact only. Production builds never compile or register either WDIO
# plugin, and the E2E-only capability is supplied by tauri.e2e.conf.json.
tauri-e2e = [
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name unique so it does not conflict with the
# bin name (only an issue on Windows, see rust-lang/cargo#8519).
name = "onecad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
onecad-core = { workspace = true }
onecad-library = { path = "crates/onecad-library" }
# WP-AI: the OCAK1 assistant-bridge codec (ADR-0016). Its `codec` feature is the
# async half; the app crate is the only consumer that needs it.
onecad-assistant-protocol = { path = "crates/onecad-assistant-protocol", features = [
    "codec",
] }
onecad-protocol = { workspace = true, features = ["client", "tracing"] }
# Do not enable Tauri's `tracing` feature. In tauri-runtime-wry 2.11.x it makes
# background `eval_script` synchronous; `AppHandle::emit` then waits for the main
# thread while retaining Tauri's webview registry mutex. A simultaneous IPC fetch
# takes the inverse path and deadlocks. OneCAD keeps command timing in its own
# tracing/log-event lanes without enabling that framework path.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The OCAK1 reader/writer tasks frame over `OcakCodec` and buffer into `BytesMut`
# (`crate::assistant::bridge`); both are already in the graph via onecad-protocol.
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
# The dev-observability subscriber (`crate::logging`): stderr fmt layer + the
# `logs/dev.jsonl` JSONL layer, both behind one `RUST_LOG`-aware `EnvFilter`.
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
# R-WP10: the geometry-backend seam (MeshProvider / AdoptingEngine) implements the
# core `#[async_trait]` GeometryEngine, so the app crate needs async-trait too.
async-trait = { workspace = true }
# R-WP11: verify the SHA-256 integrity of assembled MESH1 bulk streams (SCHEMA §5.2).
sha2 = { workspace = true }
# Preview thumbnails cross the IPC boundary as base64 (in from `save_document`, out
# as a `data:` URL in `list_recents`). Already in the lock as a tauri transitive at
# this exact version — declaring it adds no crate to the build graph.
base64 = "0.22"
# Parses the `onecad-library-ingest` recipe (`STEP/ingest.toml`). Same version
# `onecad-library` pins, and already in the lock as its dependency — declaring it
# adds no crate to the build graph.
toml = "0.8"
# Recents card management: move a deleted project to the OS trash instead of
# a permanent `remove_file` (macOS/Windows/Linux).
trash = "5"
# The assistant's local-provider gateway (ADR-0017) needs an HTTP client. reqwest
# is already resolved in this lock -- tauri depends on it on Android and Apple
# mobile -- so this adds no new crate to the dependency graph, only to the desktop
# build. `default-features = false` is deliberate and load-bearing:
#   * it drops `system-proxy`, so the client cannot pick a proxy up from the
#     environment even before `ClientBuilder::no_proxy()` says so explicitly;
#   * it drops `default-tls`. The gateway talks to loopback inference servers over
#     plain HTTP, and pulling rustls in to serve an `https://127.0.0.1` nobody has
#     asked for would add a TLS stack to every desktop build. A registered `https`
#     base is refused at registration with that reason named
#     (`GatewayError::TlsNotBuilt`), never attempted and failed obscurely.
reqwest = { version = "0.13", default-features = false }

# M5b: crash-marker liveness — `kill(pid, 0)` for the autosave recovery scan
# (`io::recovery` injects the predicate; the app owns the platform syscall).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `tauri::test::mock_app` gives integration tests a real `tauri::State<AppState>`
# (its constructor is otherwise crate-private) so `sketch_on_face.rs` can call the
# actual `#[tauri::command]` fn instead of re-deriving its logic. `test = []` in
# tauri's own manifest — zero extra transitive deps, dev-only (not in the bundle).
tauri = { version = "2", features = ["test"] }
# Save/reopen round-trip tests for the open/save command path; chaos drills spawn
# the built stub bin from a scratch dir.
tempfile = "3"
# M2 gate: byte-compare `document.json` inside two saved v2 containers (byte-stable
# save proof) — the same reader onecad-core uses.
zip = { workspace = true }
# R-WP11 chaos/convergence/smoke integration tests drive the WorkerManager over
# the real stub/worker with core plan types, and validate MESH1 headers.
onecad-core = { workspace = true }
onecad-protocol = { workspace = true, features = ["client", "tracing"] }
uuid = { workspace = true }
serde_json = { workspace = true }
# `net` is for test fixtures only: `assistant_provider_gateway.rs` stands up a
# throwaway HTTP/1.1 server on 127.0.0.1:0 so the redirect, size and cancellation
# gates have a real upstream to observe. No product code binds a listener.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "time",
    "sync",
] }
