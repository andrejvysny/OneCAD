[[part]]
file = "AluminiumProfiles/CAD_RP4050_5_20x60_Normal_Rollco.step"
kind = "profile"
id = "onecad.vendor.rollco.rp4050"
name = "Rollco RP4050 20x60"
vendor = "rollco"
