# Vendor-STEP → component-library ingest recipe.
#
#   cd src-tauri
#   cargo run --release -p onecad-library-ingest -- ../STEP/ingest.toml --inspect
#   cargo run --release -p onecad-library-ingest -- ../STEP/ingest.toml --library-root <dir>
#
# The STEP files themselves are gitignored (vendor downloads, 0.2–7 MB); only
# this recipe is tracked, so the exact keep-lists below survive even where the
# files do not. Every `[part.keep]` decision is recorded with the `--inspect`
# evidence it was made from — solid index, volume and bounding box — because
# neither of the two assemblies here carries usable product names (see the
# comments on each), so nothing about the choice is re-derivable from the file.

[defaults]
vendor = "vendor"
category = ["imported"]
version = "1.0.0"

# ── Rollco T-slot aluminium extrusions ───────────────────────────────────────
#
# Each file is ONE solid: a 500 mm stick, AP203, named by the vendor. They are
# ingested as `profile` rather than `embedded` because the vendor ships one
# length and a usable library needs every length: `ExtractPrismProfile` bakes
# the canonical end-cap face and the worker re-prisms it per instance.
#
# `--inspect` evidence (solid 0 of 1 in every file):
#   RP4030   91925.946 mm³   78 faces   20.0×20.0×500.0   "PP4030-500-Rollco"
#   RP4031   94405.231 mm³   78 faces   500.0×20.0×20.0   "RP4031"   ← along +X
#   RP4040  165849.450 mm³  126 faces   40.0×20.0×500.0   "PP4040-500-Rollco"
#   RP4050  239772.954 mm³  174 faces   60.0×20.0×500.0   "PP4050-500-Rollco"
#   RP4070  257077.206 mm³  183 faces   40.0×40.0×500.0   "PP4070-500-Rollco"
#
# No keep-list on any of them: one solid in, one solid out. RP4031 needs no
# `axis_hint` either — the worker finds the extrusion axis itself, and it is the
# only one of the five modelled along +X rather than +Z.

[[part]]
file = "AluminiumProfiles/CAD_RP4030_5_20x20_Normal_Rollco.step"
kind = "profile"
id = "onecad.vendor.rollco.rp4030"
name = "Rollco RP4030 20x20"
vendor = "rollco"
standard = "Rollco RP"
designation = "RP4030 20x20 L={length}"
category = ["profiles", "aluminium"]
tags = ["20x20", "t-slot", "rollco"]
[part.profile]
length_default = 500.0
length_min = 1.0

[[part]]
file = "AluminiumProfiles/CAD_RP4031_5_20x20_1N_Normal_Rollco.STEP"
kind = "profile"
id = "onecad.vendor.rollco.rp4031"
name = "Rollco RP4031 20x20 1N"
vendor = "rollco"
standard = "Rollco RP"
designation = "RP4031 20x20 1N L={length}"
category = ["profiles", "aluminium"]
tags = ["20x20", "t-slot", "rollco"]
[part.profile]
length_default = 500.0
length_min = 1.0

[[part]]
file = "AluminiumProfiles/CAD_RP4040_5_20x40_Normal_Rollco.step"
kind = "profile"
id = "onecad.vendor.rollco.rp4040"
name = "Rollco RP4040 20x40"
vendor = "rollco"
