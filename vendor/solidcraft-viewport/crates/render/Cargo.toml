[package]
name = "solidcraft-render"
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
solidcraft-geom = { path = "../geom" }
serde = { version = "1", features = ["derive", "rc"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr", "jpeg"] }
moxcms = { version = "0.8.1", default-features = false, features = ["extended_range"] }
png = "0.18.1"
sha2 = "0.10"
weezl = "0.1.12"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
