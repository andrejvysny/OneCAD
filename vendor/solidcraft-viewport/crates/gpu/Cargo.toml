[package]
name = "solidcraft-gpu"
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
solidcraft-geom = { path = "../geom" }
solidcraft-render = { path = "../render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12", "gles"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
naga = { version = "30", default-features = false, features = ["wgsl-in", "hlsl-out"] }
