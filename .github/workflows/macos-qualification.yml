name: Automated macOS qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Assert runner architecture
        run: scripts/check-macos-architecture.sh "${{ runner.arch }}"
      - name: Install worker dependencies
        run: brew install boost eigen nlohmann-json ninja
      - name: Select pinned repository Rust toolchain
        run: rustup show active-toolchain
      - name: Run complete automated campaign
        env:
          ONECAD_OCCT_ROOT: ${{ runner.temp }}/onecad-occt/8.0.1
        run: cargo xtask qualify-macos --out "$RUNNER_TEMP/onecad-qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-qualification-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/onecad-qualification
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: macos-qualification-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/onecad-qualification-downloaded
      - name: Verify downloaded evidence against source and exact inventory
        run: cargo xtask verify-qualification "$RUNNER_TEMP/onecad-qualification-downloaded"
