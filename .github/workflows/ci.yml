# CI — two lanes.
#
# SELF-HOSTED (Linux/x86_64, Proxmox LXC 107) carries the bulk of the work. Its
# OCCT prefix and worker build tree are PERSISTENT, so the 40-90 min kernel build
# is paid once rather than restored from cache on every run.
#
# macOS stays the SHIPPING gate and is deliberately not reducible to the Linux
# lane: the packaging linkage smoke has no Linux equivalent (otool, a relocated
# .app, bundle-dylibs.sh), webkit is the closest proxy for the WKWebView Tauri
# actually ships on, and `cargo test --workspace` needs the staged sidecar the
# app crate's build script demands.
#
# The kernelbench DIGEST gate runs only on the self-hosted runner, because that
# is the only stable machine here. Measured the hard way: a darwin-arm64 baseline
# recorded on a developer Mac did not reproduce on GitHub's macos-14 image (the
# trig-heavy `valence4-*` family moved), so digests are a same-MACHINE tripwire,
# not a same-platform one. What IS portable is behaviour, and the semantics gate
# runs on both lanes.
#
# SECURITY — why every self-hosted job carries the same `if:`.
# This repository is PUBLIC and the runner is a container on a private LAN. A
# workflow triggered by a pull request FROM A FORK runs that fork's code on the
# runner, so self-hosted jobs are gated to events whose code is already trusted:
# a push to this repo, or a PR whose head branch lives in this repo. Fork PRs
# still get the full GitHub-hosted lane (frontend, both e2e projects, and the
# whole macOS gate). Do not remove those conditions, and do not add a
# self-hosted job without one.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  OCCT_PRIMARY_BUILD_ID: onecad-occt-8.0.1-b8f597c67781-kp1
  OCCT_COMPARISON_BUILD_ID: onecad-occt-7.9.3-a016080bf673-kp1
  # Persistent paths on the self-hosted runner, shared with self-hosted.yml so
  # both lanes reuse one incremental build. actions/checkout runs `git clean
  # -ffdx`, so anything inside the workspace would be deleted between jobs.
  OCCT_PREFIX: /home/github-runner/.onecad-occt/8.0.1
  LINUX_WORKER_BUILD: /home/github-runner/worker-build/8.0.1

jobs:
  # ── Self-hosted lane (trusted events only) ─────────────────────────────────

  # Frontend is GitHub-hosted for now, NOT because it needs macOS or a specific
  # OS, but because `oven-sh/setup-bun` shells out to `unzip`, which the runner
  # container does not have and cannot install without root. See the pending
  # root installs listed above `e2e-chromium`.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Modeling evidence manifest
        run: |
          node scripts/verify-modeling-coverage.mjs
          scripts/tests/verify-modeling-coverage.test.sh
          node scripts/verify-modeling-contracts.mjs

  # Pure Rust crates — fmt, clippy, and unit tests for every crate that does NOT
  # depend on Tauri, GTK, WebKit, or the OCCT worker. These run in ~3 min on the
  # self-hosted runner and give near-instant feedback on domain-layer changes
  # before the heavy OCCT-dependent jobs even start.
  rust-lint-test:
    name: rust-lint-test (pure crates, no OCCT)
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (fmt + clippy)
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          rustup component add rustfmt clippy
      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: clippy (pure crates)
        working-directory: src-tauri
        run: |
          cargo clippy \
            -p onecad-core \
            -p onecad-protocol \
            -p onecad-library \
            -p onecad-worker-stub \
            -p onecad-kernelbench \
            --all-targets -- -D warnings
      - name: test (pure crates)
        working-directory: src-tauri
        run: |
          cargo test \
            -p onecad-core \
            -p onecad-protocol \
            -p onecad-library \
            -p onecad-worker-stub \
            -p onecad-kernelbench

  linux-worker:
    name: linux-worker
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require the pinned OCCT prefix
        # Built once by self-hosted.yml's s2-occt stage. Failing loudly here beats
        # a 90-minute implicit rebuild inside a per-push job.
        run: |
          set -euo pipefail
          if [ ! -f "$OCCT_PREFIX/share/onecad/occt-build.cmake" ]; then
            echo "::error::no pinned OCCT at $OCCT_PREFIX — run self-hosted.yml stage s2-occt"
            exit 1
          fi
      - name: Stdout hygiene gate
        run: scripts/check-worker-stdout-hygiene.sh
      - name: Configure worker
        run: |
          set -euo pipefail
          cmake -S worker -B "$LINUX_WORKER_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$OCCT_PREFIX" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$LINUX_WORKER_BUILD"
      - name: Build worker
        run: cmake --build "$LINUX_WORKER_BUILD" --parallel 3
      - name: Selftest version, build ID, and fingerprint
        # The fingerprint is seeded from occtVersion|sourceCommit|buildOptions|
        # buildId|kernelPolicyVersion — all platform-independent — so Linux must
        # agree with macOS on 0a6a1dce34181289 or the kernel identity is not
        # portable and nothing downstream is comparable across the two lanes.
        run: |
          set -euo pipefail
          ONECAD_WORKER_LOG=debug "$LINUX_WORKER_BUILD/onecad-worker" --selftest 2>&1 \
            | tee worker-selftest.log
          grep -F "selftest OK (occt 8.0.1," worker-selftest.log
          grep -F "build ${OCCT_PRIMARY_BUILD_ID}," worker-selftest.log
          grep -F "fingerprint 0a6a1dce34181289" worker-selftest.log
      - name: Full worker suite
        run: ctest --test-dir "$LINUX_WORKER_BUILD" --output-on-failure
      - name: Edge-op safety determinism
        run: |
          set -euo pipefail
          "$LINUX_WORKER_BUILD/tests/test_edge_op_failure" >edge-op-safety-a.ndjson
          "$LINUX_WORKER_BUILD/tests/test_edge_op_failure" >edge-op-safety-b.ndjson
          cmp edge-op-safety-a.ndjson edge-op-safety-b.ndjson

  linux-kernelbench:
    name: linux-kernelbench
    needs: linux-worker
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust toolchain (userland; the runner has no sudo)
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: Kernelbench unit + supervisor tests
        # `-p`, not `--workspace`: the app crate's build script requires a staged
        # sidecar (bundle.externalBin) and pulls in GTK/WebKitGTK on Linux.
        # `--workspace` is the macOS lane's job.
        working-directory: src-tauri
        run: cargo test -p onecad-kernelbench
      - name: T0 campaign, both backends
        working-directory: src-tauri
        env:
          ONECAD_KERNELBENCH_RUNNER: /home/github-runner/worker-build/8.0.1/onecad-kernelbench-runner
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernelbench-t0"
          echo "KB_OUT=$out" >>"$GITHUB_ENV"
          cargo run -p onecad-kernelbench -- \
            run --suite fillet/foundation --preset t0 --backend both --out-dir "$out"
          cargo run -p onecad-kernelbench -- \
            report "$out/results.jsonl" --json "$out/summary.json"
      - name: Digest baseline (linux-x64) and cross-host semantics
        # Digests are platform-keyed because they are NOT portable (see
        # scripts/kernelbench-manifest.mjs); this compares linux-x64 against
        # linux-x64, so a difference is a real regression. The semantics baseline
        # is shared with macOS and carries the portability claim.
        run: |
          set -euo pipefail
          node scripts/kernelbench-manifest.mjs compare \
            "$KB_OUT" "fillet/foundation:t0" bench/robustness/baselines/digests.json
          node scripts/kernelbench-manifest.mjs semantic-compare \
            "$KB_OUT" "fillet/foundation:t0" bench/robustness/baselines/semantics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelbench-t0-linux
          path: ${{ runner.temp }}/kernelbench-t0
          if-no-files-found: warn
          retention-days: 14

  # ── macOS shipping gate (GitHub-hosted; runs for every event, forks included) ─

  occt-fingerprint:
    name: occt-fingerprint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint normalizer tests
        run: scripts/tests/occt-fingerprint.test.sh

  occt-8-0-1:
    name: build OCCT 8.0.1
    needs: occt-fingerprint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned OCCT
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onecad-occt/8.0.1
          key: occt-macos-14-8.0.1-b8f597c67781-${{ env.OCCT_PRIMARY_BUILD_ID }}-${{ hashFiles('scripts/build-pinned-occt.sh', 'scripts/occt-fingerprint.sh') }}
      - name: Install build tool
        run: brew install ninja
      - name: Build pinned OCCT
        run: >-
          scripts/build-pinned-occt.sh
          --version 8.0.1
          --prefix "$RUNNER_TEMP/onecad-occt/8.0.1"
          --build-dir "$RUNNER_TEMP/onecad-occt-build/8.0.1"
          --build-id "$OCCT_PRIMARY_BUILD_ID"
      - name: Package OCCT artifact
        run: tar -czf "$RUNNER_TEMP/onecad-occt-8.0.1.tar.gz" -C "$RUNNER_TEMP/onecad-occt/8.0.1" .
      - uses: actions/upload-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-8.0.1.tar.gz
          if-no-files-found: error
          retention-days: 7

  worker-8-0-1:
    name: worker-8.0.1
    needs: occt-8-0-1
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install worker dependencies
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - name: Stdout hygiene gate
        run: scripts/check-worker-stdout-hygiene.sh
      - name: Configure worker
        run: |
          cmake -S worker -B worker/build-8.0.1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/8.0.1" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-8.0.1"
      - name: Build worker
        run: cmake --build worker/build-8.0.1 --parallel 3
      - name: Full worker suite
        run: ctest --test-dir worker/build-8.0.1 --output-on-failure
      - name: Edge-op safety determinism
        run: |
          ./worker/build-8.0.1/tests/test_edge_op_failure >edge-op-safety-a.ndjson
          ./worker/build-8.0.1/tests/test_edge_op_failure >edge-op-safety-b.ndjson
          cmp edge-op-safety-a.ndjson edge-op-safety-b.ndjson
      - name: Selftest version and build ID
        run: |
          set -o pipefail
          ONECAD_WORKER_LOG=debug ./worker/build-8.0.1/onecad-worker --selftest 2>&1 | tee worker-selftest.log
          grep -F "selftest OK (occt 8.0.1," worker-selftest.log
          grep -F "build ${OCCT_PRIMARY_BUILD_ID}," worker-selftest.log
          grep -F "fingerprint 0a6a1dce34181289" worker-selftest.log
          grep -E "^ONECAD_OCCT_BUILD_ID(:[^=]*)?=${OCCT_PRIMARY_BUILD_ID}$" \
            worker/build-8.0.1/CMakeCache.txt
      - name: Packaging linkage smoke
        # macOS-ONLY, and the main reason this job cannot move to the Linux lane.
        run: |
          app="$RUNNER_TEMP/OneCAD.app"
          mkdir -p "$app/Contents/MacOS"
          cp worker/build-8.0.1/onecad-worker "$app/Contents/MacOS/onecad-worker"
          scripts/bundle-dylibs.sh "$app"
          test -n "$(find "$app/Contents/Frameworks" -name 'libTK*.dylib' -print -quit)"
          scripts/bundle-dylibs.sh "$app"
          mkdir -p "$RUNNER_TEMP/relocated"
          mv "$app" "$RUNNER_TEMP/relocated/OneCAD.app"
          app="$RUNNER_TEMP/relocated/OneCAD.app"
          mv "$RUNNER_TEMP/onecad-occt/8.0.1" "$RUNNER_TEMP/onecad-occt/8.0.1.hidden"
          "$app/Contents/MacOS/onecad-worker" --selftest
          : >packaged-linkage.txt
          : >packaged-paths.txt
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              printf '\n== %s ==\n' "$binary" >>packaged-linkage.txt
              otool -L "$binary" >>packaged-linkage.txt
              otool -l "$binary" >>packaged-linkage.txt
              otool -L "$binary" | tail -n +2 | awk '{print $1}' >>packaged-paths.txt
              otool -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next }
                in_rpath && $1 == "path" { print $2; in_rpath = 0 }
              ' >>packaged-paths.txt
            fi
          done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0)
          cat packaged-linkage.txt
          if grep -Ei '/opt/homebrew/opt/(occt|opencascade)' packaged-paths.txt; then
            echo "packaged worker resolved mutable Homebrew OCCT" >&2
            exit 1
          fi
          if grep -F "$RUNNER_TEMP" packaged-paths.txt; then
            echo "packaged worker retained runner-local linkage" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/onecad-occt/8.0.1.hidden" "$RUNNER_TEMP/onecad-occt/8.0.1"

  rust-8-0-1:
    name: rust-8.0.1
    needs: occt-8-0-1
    runs-on: macos-14
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install worker dependencies
        working-directory: .
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - name: Build and stage worker
        working-directory: .
        run: |
          scripts/check-worker-stdout-hygiene.sh
          cmake -S worker -B worker/build-8.0.1-rust -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/8.0.1" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-8.0.1-rust"
          cmake --build worker/build-8.0.1-rust --parallel 3
          triple="$(rustc -Vv | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          cp worker/build-8.0.1-rust/onecad-worker "src-tauri/binaries/onecad-worker-${triple}"
          chmod +x "src-tauri/binaries/onecad-worker-${triple}"
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        env:
          ONECAD_WORKER_PATH: ${{ github.workspace }}/worker/build-8.0.1-rust/onecad-worker
          ONECAD_REQUIRE_WORKER: "1"
        run: cargo test --workspace
      - name: Kernelbench T0 gate
        env:
          ONECAD_KERNELBENCH_RUNNER: ${{ github.workspace }}/worker/build-8.0.1-rust/onecad-kernelbench-runner
        run: |
          set +e
          cargo run -p onecad-kernelbench -- run \
            --suite fillet/foundation --preset t0 --backend both \
            --out-dir ../worker/build-8.0.1-rust/kernelbench-t0
          bench_exit=$?
          set -e
          report_exit=0
          cargo run -p onecad-kernelbench -- report \
            ../worker/build-8.0.1-rust/kernelbench-t0/results.jsonl \
            --json ../worker/build-8.0.1-rust/kernelbench-t0/summary.json || report_exit=$?
          if [ "$bench_exit" -eq 0 ]; then
            exit "$report_exit"
          fi
          exit "$bench_exit"
      - name: Cross-host semantics gate
        # NO digest gate here, deliberately. Digests turned out to be a
        # same-MACHINE tripwire, not a same-platform one: this job compared
        # darwin-arm64 against a darwin-arm64 baseline recorded on a developer
        # Mac and the trig-heavy `valence4-*` family still moved, because the
        # GitHub image's AppleClang is not the laptop's. The digest gate
        # therefore lives only on the self-hosted runner, which is one stable
        # machine. Semantics ARE portable — verified across macOS/arm64 and
        # Linux/x86_64 — so that is what gates here.
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/kernelbench-manifest.mjs semantic-compare \
            worker/build-8.0.1-rust/kernelbench-t0 "fillet/foundation:t0" \
            bench/robustness/baselines/semantics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelbench-t0-occt-8.0.1
          path: worker/build-8.0.1-rust/kernelbench-t0
          if-no-files-found: warn
          retention-days: 14

  e2e-webkit:
    name: e2e-webkit
    runs-on: macos-14
    # WKWebView is what Tauri ships on macOS, so this half of the browser matrix
    # is fidelity-critical and stays here.
    #
    # PENDING ROOT INSTALLS on the runner container (LXC 107). Once these land,
    # `frontend` and `e2e-chromium` can both move to [self-hosted, Linux, X64]:
    #   apt-get install -y --no-install-recommends unzip \
    #     libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
    #     libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
    #     libgbm1 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0 fonts-liberation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-macos-14-${{ hashFiles('bun.lock') }}
      - name: Install webkit
        run: bunx playwright install webkit
      - name: Run
        run: bun run e2e -- --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-webkit-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  e2e-chromium:
    name: e2e-chromium
    # macOS, not ubuntu, and not arbitrarily: on ubuntu the two
    # `boolean-preview` specs fail on a body pick that succeeds everywhere else
    # ("Choose Union / Cut / Intersect" never appears). The suite raycasts real
    # handle positions through SwiftShader, so a Linux GL difference is a
    # plausible cause and a real finding — but it is its own investigation, and
    # gating on an environment the suite has never been validated in would just
    # be shipping a red check.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-macos-14-${{ hashFiles('bun.lock') }}
      - name: Install chromium
        run: bunx playwright install chromium
      - name: Run
        run: bun run e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-chromium-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  tauri-composition:
    name: tauri-composition
    needs: occt-8-0-1
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Install worker dependencies
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - name: Build and stage worker
        env:
          ONECAD_OCCT_ROOT: ${{ runner.temp }}/onecad-occt/8.0.1
          ONECAD_OCCT_VERSION: 8.0.1
          ONECAD_OCCT_BUILD_ID: ${{ env.OCCT_PRIMARY_BUILD_ID }}
          ONECAD_WORKER_BUILD_DIR: ${{ github.workspace }}/worker/build-tauri-e2e
        run: scripts/build-worker.sh Release
      - name: Build seed Tauri test artifact
        # NO `--` before the flags. `tauri build` is `[OPTIONS] [ARGS]...`, and
        # everything after `--` is forwarded to `cargo build` — which accepts
        # `--features` and `--config` (so they looked fine) and then rejects
        # `--bundles` with "unexpected argument '--bundles' found". All three are
        # tauri's OWN options; the separator was making cargo parse them. This lane
        # had never executed on any machine, which is why a broken invocation
        # survived here.
        run: >-
          bun run tauri build
          --features tauri-e2e
          --config src-tauri/tauri.e2e.conf.json
          --bundles app
      - name: Pre-stage self-contained bundled worker
        # This seed/lockstep dance is the ONLY order that produces a bundle whose
        # embedded manifest matches the sidecar that ships — bundle-dylibs.sh
        # rewrites the sidecar, so a one-pass build always fails `verify_binary`.
        # `scripts/package-macos.sh` is the same procedure for a real (non-e2e)
        # bundle; the two must not drift. Rationale: docs/PACKAGING.md § 0.
        run: |
          set -euo pipefail
          seed="src-tauri/target/release/bundle/macos/onecad.app"
          scripts/bundle-dylibs.sh "$seed"
          triple="$(rustc -Vv | sed -n 's/^host: //p')"
          staged="src-tauri/binaries/onecad-worker-$triple"
          cp "$seed/Contents/MacOS/onecad-worker" "$staged"
          chmod +x "$staged"
          cp -R "$seed/Contents/Frameworks" "$RUNNER_TEMP/onecad-frameworks"
          bun -e '
            const [binaryPath, manifestPath] = process.argv.slice(1);
            const manifest = JSON.parse(await Bun.file(manifestPath).text());
            const binary = new Uint8Array(await Bun.file(binaryPath).arrayBuffer());
            manifest.binarySha256 = new Bun.CryptoHasher("sha256")
              .update(binary)
              .digest("hex");
            await Bun.write(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          ' "$staged" src-tauri/binaries/onecad-worker-manifest.json
      - name: Build lockstep Tauri test artifact
        # Same fix as the seed build above — see the comment there.
        run: >-
          bun run tauri build
          --features tauri-e2e
          --config src-tauri/tauri.e2e.conf.json
          --bundles app
      - name: Restore bundled dylibs without rewriting worker
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/onecad.app"
          mkdir -p "$app/Contents/Frameworks"
          cp -R "$RUNNER_TEMP/onecad-frameworks/." "$app/Contents/Frameworks/"
          codesign --force --sign - "$app"
      - name: Relocate and verify bundled worker
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/tauri-composition-results"
          relocated="$RUNNER_TEMP/relocated-onecad"
          mkdir -p "$results" "$relocated"
          mv src-tauri/target/release/bundle/macos/onecad.app "$relocated/onecad.app"
          app="$relocated/onecad.app"
          worker="$app/Contents/MacOS/onecad-worker"
          expected="$(bun -e 'console.log(JSON.parse(await Bun.file(process.argv[1]).text()).binarySha256)' src-tauri/binaries/onecad-worker-manifest.json)"
          actual="$(shasum -a 256 "$worker" | awk '{print $1}')"
          test "$actual" = "$expected"
          "$worker" --selftest 2>&1 | tee "$results/bundled-worker-selftest.log"
          grep -F "fingerprint 0a6a1dce34181289" "$results/bundled-worker-selftest.log"
          mv worker/build-tauri-e2e/onecad-worker worker/build-tauri-e2e/onecad-worker.hidden
          triple="$(rustc -Vv | sed -n 's/^host: //p')"
          mv "src-tauri/binaries/onecad-worker-$triple" \
            "src-tauri/binaries/onecad-worker-$triple.hidden"
          echo "ONECAD_TAURI_E2E_APP=$app" >>"$GITHUB_ENV"
          echo "ONECAD_TAURI_E2E_RESULTS=$results" >>"$GITHUB_ENV"
          echo "ONECAD_TAURI_E2E_DOCUMENT=$results/composition.onecad" >>"$GITHUB_ENV"
      - name: Real Tauri composition
        env:
          ONECAD_WORKER_PATH: ""
        run: |
          set -o pipefail
          bun run e2e:tauri 2>&1 | tee "$ONECAD_TAURI_E2E_RESULTS/wdio.log"
      - name: Process cleanup
        if: always()
        run: |
          sleep 2
          if pgrep -fl 'relocated-onecad/onecad.app/Contents/MacOS/(onecad|onecad-worker)'; then
            echo "Tauri app or worker survived the WDIO session" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-composition-results
          path: |
            ${{ runner.temp }}/tauri-composition-results
            ${{ runner.temp }}/relocated-onecad/onecad.app
          if-no-files-found: error
          retention-days: 14

  # ── Cross-version document compatibility ───────────────────────────────────
  # The 7.9.3 WORKER characterization job is gone (it never compiled: four
  # benchmark sites call `failure.what()`, absent from 7.9.3's Standard_Failure,
  # and `continue-on-error` masked it on every run). These two remain because
  # they answer a different question — a document written by the older kernel
  # must still reopen under the shipping one — and they build only the
  # `test_occt_persistence` target, which never touches the benchmark sources.

  persistence-producer-7-9-3:
    name: persistence-producer-7.9.3
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned OCCT
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onecad-occt/7.9.3
          key: occt-macos-14-7.9.3-a016080bf673-${{ env.OCCT_COMPARISON_BUILD_ID }}-${{ hashFiles('scripts/build-pinned-occt.sh', 'scripts/occt-fingerprint.sh') }}
      - name: Install dependencies
        run: brew install boost eigen nlohmann-json ninja
      - name: Build pinned persistence OCCT
        run: >-
          scripts/build-pinned-occt.sh
          --version 7.9.3
          --prefix "$RUNNER_TEMP/onecad-occt/7.9.3"
          --build-dir "$RUNNER_TEMP/onecad-occt-build/7.9.3"
          --build-id "$OCCT_COMPARISON_BUILD_ID"
      - name: Build minimal persistence producer
        run: |
          cmake -S worker -B worker/build-persistence-7.9.3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/7.9.3" \
            -DONECAD_OCCT_VERSION=7.9.3 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_COMPARISON_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-persistence-7.9.3"
          cmake --build worker/build-persistence-7.9.3 \
            --target test_occt_persistence --parallel 3
      - name: Produce 7.9.3 persistence artifact
        run: |
          mkdir -p "$RUNNER_TEMP/occt-persistence"
          ./worker/build-persistence-7.9.3/tests/test_occt_persistence produce \
            "$RUNNER_TEMP/occt-persistence"
      - uses: actions/upload-artifact@v4
        with:
          name: occt-7.9.3-persistence
          path: ${{ runner.temp }}/occt-persistence
          if-no-files-found: error
          retention-days: 7

  persistence-7-to-8:
    name: persistence-7.9.3-to-8.0.1
    needs: [occt-8-0-1, persistence-producer-7-9-3]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install worker dependencies
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - uses: actions/download-artifact@v4
        with:
          name: occt-7.9.3-persistence
          path: ${{ runner.temp }}/occt-persistence
      - name: Build 8.0.1 persistence reader
        run: |
          cmake -S worker -B worker/build-persistence-8.0.1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/8.0.1" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-persistence-8.0.1"
          cmake --build worker/build-persistence-8.0.1 \
            --target test_occt_persistence --parallel 3
      - name: Reopen 7.9.3 persistence under 8.0.1
        run: >-
          ./worker/build-persistence-8.0.1/tests/test_occt_persistence consume
          "$RUNNER_TEMP/occt-persistence"
