name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  OCCT_PRIMARY_BUILD_ID: onecad-occt-8.0.1-b8f597c67781-kp1
  OCCT_COMPARISON_BUILD_ID: onecad-occt-7.9.3-a016080bf673-kp1
  # Persistent paths on the self-hosted runner, shared with self-hosted.yml so
  # both lanes reuse one incremental build. actions/checkout runs `git clean
  # -ffdx`, so anything inside the workspace would be deleted between jobs.
  OCCT_PREFIX: /home/github-runner/.onecad-occt/8.0.1
  LINUX_WORKER_BUILD: /home/github-runner/worker-build/8.0.1

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Tooling lint
        run: cargo clippy -p xtask --all-targets -- -D warnings
      - name: Tooling tests
        run: cargo test -p xtask
      - name: Rust dependency boundaries
        run: |
          cargo xtask check-rust-layers
          cargo test -p xtask checks::tests
      - name: Modeling evidence
        run: |
          cargo xtask verify-modeling-coverage
          cargo test -p xtask checks
          cargo xtask verify-modeling-contracts
          cargo xtask check-hygiene
          cargo xtask bake-cad-icons --check


  linux-worker:
    name: linux-worker
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require the pinned OCCT prefix
        # Built once by self-hosted.yml's s2-occt stage. Failing loudly here beats
        # a 90-minute implicit rebuild inside a per-push job.
        run: |
          set -euo pipefail
          if [ ! -f "$OCCT_PREFIX/share/onecad/occt-build.cmake" ]; then
            echo "::error::no pinned OCCT at $OCCT_PREFIX — run self-hosted.yml stage s2-occt"
            exit 1
          fi
      - name: Stdout hygiene gate
        run: scripts/check-worker-stdout-hygiene.sh
      - name: Configure worker
        run: |
          set -euo pipefail
          cmake -S worker -B "$LINUX_WORKER_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$OCCT_PREFIX" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$LINUX_WORKER_BUILD"
      - name: Build worker
        run: cmake --build "$LINUX_WORKER_BUILD" --parallel 3
      - name: Selftest version, build ID, and fingerprint
        # The fingerprint is seeded from occtVersion|sourceCommit|buildOptions|
        # buildId|kernelPolicyVersion — all platform-independent — so Linux must
        # agree with macOS on 0a6a1dce34181289 or the kernel identity is not
        # portable and nothing downstream is comparable across the two lanes.
        run: |
          set -euo pipefail
          ONECAD_WORKER_LOG=debug "$LINUX_WORKER_BUILD/onecad-worker" --selftest 2>&1 \
            | tee worker-selftest.log
          grep -F "selftest OK (occt 8.0.1," worker-selftest.log
          grep -F "build ${OCCT_PRIMARY_BUILD_ID}," worker-selftest.log
          grep -F "fingerprint 0a6a1dce34181289" worker-selftest.log
      - name: Full worker suite
        run: ctest --test-dir "$LINUX_WORKER_BUILD" --output-on-failure
      - name: Edge-op safety determinism
        run: |
          set -euo pipefail
          "$LINUX_WORKER_BUILD/tests/test_edge_op_failure" >edge-op-safety-a.ndjson
          "$LINUX_WORKER_BUILD/tests/test_edge_op_failure" >edge-op-safety-b.ndjson
          cmp edge-op-safety-a.ndjson edge-op-safety-b.ndjson

  linux-kernelbench:
    name: linux-kernelbench
    needs: linux-worker
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (userland; the runner has no sudo)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          rustup show active-toolchain
      - name: Kernelbench unit + supervisor tests
        # Keep this lane focused on the portable benchmark supervisor.
        # The full native desktop workspace runs in the macOS lane.
        working-directory: .
        run: cargo test -p onecad-kernelbench
      - name: T0 campaign, both backends
        working-directory: .
        env:
          ONECAD_KERNELBENCH_RUNNER: /home/github-runner/worker-build/8.0.1/onecad-kernelbench-runner
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kernelbench-t0"
          echo "KB_OUT=$out" >>"$GITHUB_ENV"
          cargo run -p onecad-kernelbench -- \
            run --suite fillet/foundation --preset t0 --backend both --out-dir "$out"
          cargo run -p onecad-kernelbench -- \
            report "$out/results.jsonl" --json "$out/summary.json"
      - name: Digest baseline (linux-x64) and cross-host semantics
        # Digests are platform-keyed because they are NOT portable (see
        # xtask/src/evidence); this compares linux-x64 against
        # linux-x64, so a difference is a real regression. The semantics baseline
        # is shared with macOS and carries the portability claim.
        run: |
          set -euo pipefail
          cargo xtask kernelbench-manifest compare \
            "$KB_OUT" "fillet/foundation:t0" bench/robustness/baselines/digests.json
          cargo xtask kernelbench-manifest semantic-compare \
            "$KB_OUT" "fillet/foundation:t0" bench/robustness/baselines/semantics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelbench-t0-linux
          path: ${{ runner.temp }}/kernelbench-t0
          if-no-files-found: warn
          retention-days: 14

  # ── macOS shipping gate (GitHub-hosted; runs for every event, forks included) ─

  occt-fingerprint:
    name: occt-fingerprint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint normalizer tests
        run: scripts/tests/occt-fingerprint.test.sh

  occt-8-0-1:
    name: build OCCT 8.0.1
    needs: occt-fingerprint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned OCCT
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onecad-occt/8.0.1
          key: occt-macos-14-8.0.1-b8f597c67781-${{ env.OCCT_PRIMARY_BUILD_ID }}-${{ hashFiles('scripts/build-pinned-occt.sh', 'scripts/occt-fingerprint.sh') }}
      - name: Install build tool
        run: brew install ninja
      - name: Build pinned OCCT
        run: >-
          scripts/build-pinned-occt.sh
          --version 8.0.1
          --prefix "$RUNNER_TEMP/onecad-occt/8.0.1"
          --build-dir "$RUNNER_TEMP/onecad-occt-build/8.0.1"
          --build-id "$OCCT_PRIMARY_BUILD_ID"
      - name: Package OCCT artifact
        run: tar -czf "$RUNNER_TEMP/onecad-occt-8.0.1.tar.gz" -C "$RUNNER_TEMP/onecad-occt/8.0.1" .
      - uses: actions/upload-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-8.0.1.tar.gz
          if-no-files-found: error
          retention-days: 7

  worker-8-0-1:
    name: worker-8.0.1
    needs: occt-8-0-1
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install worker dependencies
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - name: Stdout hygiene gate
        run: scripts/check-worker-stdout-hygiene.sh
      - name: Configure worker
        run: |
          cmake -S worker -B worker/build-8.0.1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/8.0.1" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-8.0.1"
      - name: Build worker
        run: cmake --build worker/build-8.0.1 --parallel 3
      - name: Full worker suite
        run: ctest --test-dir worker/build-8.0.1 --output-on-failure
      - name: Edge-op safety determinism
        run: |
          ./worker/build-8.0.1/tests/test_edge_op_failure >edge-op-safety-a.ndjson
          ./worker/build-8.0.1/tests/test_edge_op_failure >edge-op-safety-b.ndjson
          cmp edge-op-safety-a.ndjson edge-op-safety-b.ndjson
      - name: Selftest version and build ID
        run: |
          set -o pipefail
          ONECAD_WORKER_LOG=debug ./worker/build-8.0.1/onecad-worker --selftest 2>&1 | tee worker-selftest.log
          grep -F "selftest OK (occt 8.0.1," worker-selftest.log
          grep -F "build ${OCCT_PRIMARY_BUILD_ID}," worker-selftest.log
          grep -F "fingerprint 0a6a1dce34181289" worker-selftest.log
          grep -E "^ONECAD_OCCT_BUILD_ID(:[^=]*)?=${OCCT_PRIMARY_BUILD_ID}$" \
            worker/build-8.0.1/CMakeCache.txt
      - name: Packaging linkage smoke
        # macOS-ONLY, and the main reason this job cannot move to the Linux lane.
        run: |
          app="$RUNNER_TEMP/OneCAD.app"
          mkdir -p "$app/Contents/MacOS"
          cp worker/build-8.0.1/onecad-worker "$app/Contents/MacOS/onecad-worker"
          scripts/bundle-dylibs.sh "$app"
          test -n "$(find "$app/Contents/Frameworks" -name 'libTK*.dylib' -print -quit)"
          scripts/bundle-dylibs.sh "$app"
          mkdir -p "$RUNNER_TEMP/relocated"
          mv "$app" "$RUNNER_TEMP/relocated/OneCAD.app"
          app="$RUNNER_TEMP/relocated/OneCAD.app"
          mv "$RUNNER_TEMP/onecad-occt/8.0.1" "$RUNNER_TEMP/onecad-occt/8.0.1.hidden"
          "$app/Contents/MacOS/onecad-worker" --selftest
          : >packaged-linkage.txt
          : >packaged-paths.txt
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              printf '\n== %s ==\n' "$binary" >>packaged-linkage.txt
              otool -L "$binary" >>packaged-linkage.txt
              otool -l "$binary" >>packaged-linkage.txt
              otool -L "$binary" | tail -n +2 | awk '{print $1}' >>packaged-paths.txt
              otool -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_RPATH" { in_rpath = 1; next }
                in_rpath && $1 == "path" { print $2; in_rpath = 0 }
              ' >>packaged-paths.txt
            fi
          done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0)
          cat packaged-linkage.txt
          if grep -Ei '/opt/homebrew/opt/(occt|opencascade)' packaged-paths.txt; then
            echo "packaged worker resolved mutable Homebrew OCCT" >&2
            exit 1
          fi
          if grep -F "$RUNNER_TEMP" packaged-paths.txt; then
            echo "packaged worker retained runner-local linkage" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/onecad-occt/8.0.1.hidden" "$RUNNER_TEMP/onecad-occt/8.0.1"

  rust-8-0-1:
    name: rust-8.0.1
    needs: occt-8-0-1
    runs-on: macos-14
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install worker dependencies
        working-directory: .
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - name: Build and stage worker
        working-directory: .
        run: |
          ONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/8.0.1" \
          ONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
          ONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-8.0.1-rust" \
          scripts/build-worker.sh Release
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: fmt
        run: cargo fmt --check -p onecad-mesh-fixture -p onecad-app -p onecad-core -p onecad-protocol -p onecad-scene -p onecad-render -p onecad-interaction -p onecad-ui -p onecad-widgets -p onecad-worker-stub -p onecad-regen -p onecad-kernelbench -p onecad-library -p onecad-library-ingest -p xtask
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        env:
          ONECAD_WORKER_PATH: ${{ github.workspace }}/worker/build-8.0.1-rust/onecad-worker
          ONECAD_REQUIRE_WORKER: "1"
        run: cargo test --workspace
      - name: Kernelbench T0 gate
        env:
          ONECAD_KERNELBENCH_RUNNER: ${{ github.workspace }}/worker/build-8.0.1-rust/onecad-kernelbench-runner
        run: |
          set +e
          cargo run -p onecad-kernelbench -- run \
            --suite fillet/foundation --preset t0 --backend both \
            --out-dir worker/build-8.0.1-rust/kernelbench-t0
          bench_exit=$?
          set -e
          report_exit=0
          cargo run -p onecad-kernelbench -- report \
            worker/build-8.0.1-rust/kernelbench-t0/results.jsonl \
            --json worker/build-8.0.1-rust/kernelbench-t0/summary.json || report_exit=$?
          if [ "$bench_exit" -eq 0 ]; then
            exit "$report_exit"
          fi
          exit "$bench_exit"
      - name: Cross-host semantics gate
        # NO digest gate here, deliberately. Digests turned out to be a
        # same-MACHINE tripwire, not a same-platform one: this job compared
        # darwin-arm64 against a darwin-arm64 baseline recorded on a developer
        # Mac and the trig-heavy `valence4-*` family still moved, because the
        # GitHub image's AppleClang is not the laptop's. The digest gate
        # therefore lives only on the self-hosted runner, which is one stable
        # machine. Semantics ARE portable — verified across macOS/arm64 and
        # Linux/x86_64 — so that is what gates here.
        working-directory: .
        run: |
          set -euo pipefail
          cargo xtask kernelbench-manifest semantic-compare \
            worker/build-8.0.1-rust/kernelbench-t0 "fillet/foundation:t0" \
            bench/robustness/baselines/semantics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelbench-t0-occt-8.0.1
          path: worker/build-8.0.1-rust/kernelbench-t0
          if-no-files-found: warn
          retention-days: 14

  persistence-producer-7-9-3:
    name: persistence-producer-7.9.3
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned OCCT
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onecad-occt/7.9.3
          key: occt-macos-14-7.9.3-a016080bf673-${{ env.OCCT_COMPARISON_BUILD_ID }}-${{ hashFiles('scripts/build-pinned-occt.sh', 'scripts/occt-fingerprint.sh') }}
      - name: Install dependencies
        run: brew install boost eigen nlohmann-json ninja
      - name: Build pinned persistence OCCT
        run: >-
          scripts/build-pinned-occt.sh
          --version 7.9.3
          --prefix "$RUNNER_TEMP/onecad-occt/7.9.3"
          --build-dir "$RUNNER_TEMP/onecad-occt-build/7.9.3"
          --build-id "$OCCT_COMPARISON_BUILD_ID"
      - name: Build minimal persistence producer
        run: |
          cmake -S worker -B worker/build-persistence-7.9.3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/7.9.3" \
            -DONECAD_OCCT_VERSION=7.9.3 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_COMPARISON_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-persistence-7.9.3"
          cmake --build worker/build-persistence-7.9.3 \
            --target test_occt_persistence --parallel 3
      - name: Produce 7.9.3 persistence artifact
        run: |
          mkdir -p "$RUNNER_TEMP/occt-persistence"
          ./worker/build-persistence-7.9.3/tests/test_occt_persistence produce \
            "$RUNNER_TEMP/occt-persistence"
      - uses: actions/upload-artifact@v4
        with:
          name: occt-7.9.3-persistence
          path: ${{ runner.temp }}/occt-persistence
          if-no-files-found: error
          retention-days: 7

  persistence-7-to-8:
    name: persistence-7.9.3-to-8.0.1
    needs: [occt-8-0-1, persistence-producer-7-9-3]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install worker dependencies
        run: brew install boost eigen nlohmann-json ninja
      - uses: actions/download-artifact@v4
        with:
          name: onecad-occt-8.0.1-macos-14
          path: ${{ runner.temp }}/onecad-occt-artifact
      - name: Extract OCCT artifact
        run: |
          mkdir -p "$RUNNER_TEMP/onecad-occt/8.0.1"
          tar -xzf "$RUNNER_TEMP/onecad-occt-artifact/onecad-occt-8.0.1.tar.gz" \
            -C "$RUNNER_TEMP/onecad-occt/8.0.1"
      - uses: actions/download-artifact@v4
        with:
          name: occt-7.9.3-persistence
          path: ${{ runner.temp }}/occt-persistence
      - name: Build 8.0.1 persistence reader
        run: |
          cmake -S worker -B worker/build-persistence-8.0.1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$RUNNER_TEMP/onecad-occt/8.0.1" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$GITHUB_WORKSPACE/worker/build-persistence-8.0.1"
          cmake --build worker/build-persistence-8.0.1 \
            --target test_occt_persistence --parallel 3
      - name: Reopen 7.9.3 persistence under 8.0.1
        run: >-
          ./worker/build-persistence-8.0.1/tests/test_occt_persistence consume
          "$RUNNER_TEMP/occt-persistence"
