# Long-running experiments and benchmark campaigns on the self-hosted runner.
#
# SECURITY — why this is a separate workflow from ci.yml:
# This repository is PUBLIC and the runner is a container on a private LAN.
# `ci.yml` triggers on unfiltered `pull_request:`, so a self-hosted job placed
# there would execute a fork's code on that hardware. This workflow therefore
# triggers on `workflow_dispatch` ONLY, and every job additionally re-checks
# the repository and the event so a trigger added later is not sufficient on
# its own. Do not add `pull_request` or `pull_request_target` here.
#
# Stages run one at a time, on purpose: a failure localises to one rung of the
# ladder instead of one 90-minute job. S1 changes nothing and installs nothing —
# it reports what the runner already has.
name: self-hosted

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which rung of the validation ladder to run
        type: choice
        required: true
        default: s1-environment
        options:
          - s1-environment
          - s2-occt
          - s3-worker
          - s4-kernelbench

# Long campaigns must never run two at a time: the runner has 4 cores and one
# persistent OCCT prefix. Queue instead of cancelling — a cancelled campaign
# wastes hours of work.
concurrency:
  group: self-hosted-runner
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Must stay identical to ci.yml's OCCT_PRIMARY_BUILD_ID: the build id is part
  # of the fingerprint seed (worker/CMakeLists.txt:60), so a divergence here
  # would silently produce a different kernel identity than the shipping gate.
  OCCT_PRIMARY_BUILD_ID: onecad-occt-8.0.1-b8f597c67781-kp1
  # Persistent, outside the workspace. Self-hosted runners keep state between
  # runs, so the 40-90 min source build is a one-time cost; build-pinned-occt.sh
  # short-circuits on matching metadata (scripts/build-pinned-occt.sh:100-103).
  OCCT_PREFIX: /home/github-runner/.onecad-occt/8.0.1
  OCCT_BUILD_DIR: /home/github-runner/.onecad-occt/_build/8.0.1
  # Worker build tree lives OUTSIDE the workspace. actions/checkout runs
  # `git clean -ffdx` on every job, so anything inside the workspace is deleted
  # before the job body starts — an in-workspace build tree would be wiped
  # between S3 and S4, and S3 could never build incrementally either.
  WORKER_BUILD: /home/github-runner/worker-build/8.0.1
  KERNELBENCH_OUT: /home/github-runner/kernelbench

jobs:
  s1-environment:
    name: S1 — environment report
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && github.event_name == 'workflow_dispatch'
      && inputs.stage == 's1-environment'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect environment report
        # Never fails on a missing tool — reporting absence IS the result.
        # Only checkout failing should red this job.
        run: |
          # A report must not abort partway through because a probed tool is
          # absent — absence is the finding. Undo the default `-e -o pipefail`.
          set +e +o pipefail
          out=runner-report
          mkdir -p "$out"
          exec > >(tee "$out/environment.txt") 2>&1

          echo "=== identity ==="
          echo "runner name    : ${RUNNER_NAME:-unset}"
          echo "runner os/arch : ${RUNNER_OS:-unset}/${RUNNER_ARCH:-unset}"
          echo "workspace      : ${GITHUB_WORKSPACE:-unset}"
          echo "runner temp    : ${RUNNER_TOOL_CACHE:-unset}"
          echo "kernel         : $(uname -a)"
          [ -r /etc/os-release ] && . /etc/os-release && echo "distro         : ${PRETTY_NAME:-unknown}"
          echo "container      : $( [ -f /run/systemd/container ] && cat /run/systemd/container || echo none-detected )"

          echo
          echo "=== capacity ==="
          echo "nproc          : $(nproc)"
          echo "available par. : $(getconf _NPROCESSORS_ONLN)"
          free -m || true
          echo
          df -h / "${GITHUB_WORKSPACE:-/}" 2>/dev/null || df -h

          echo
          echo "=== toolchain (presence + version; nothing is installed) ==="
          for tool in git curl tar cmake ninja make gcc g++ pkg-config \
                      rustc cargo rustup node bun python3 sqlite3 jq sudo; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%-12s PRESENT  %s\n' "$tool" "$(command -v "$tool")"
              printf '%-12s          %s\n' '' "$("$tool" --version 2>&1 | head -1)"
            else
              printf '%-12s MISSING\n' "$tool"
            fi
          done

          echo
          echo "=== worker build dependencies (headers, not packages) ==="
          for probe in \
              "boost   /usr/include/boost/version.hpp" \
              "eigen3  /usr/include/eigen3/Eigen/Core" \
              "json    /usr/include/nlohmann/json.hpp"; do
            set -- $probe
            [ -f "$2" ] && printf '%-8s PRESENT  %s\n' "$1" "$2" \
                        || printf '%-8s MISSING  %s\n' "$1" "$2"
          done

          echo
          echo "=== privilege (S2 needs to install apt packages) ==="
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo "passwordless sudo: YES"
          else
            echo "passwordless sudo: NO — S2 dependency install needs a manual step"
          fi

          echo
          echo "=== persistent state from previous runs ==="
          echo "HOME           : $HOME"
          ls -la "$HOME" 2>/dev/null | head -20 || true
          echo "--- ~/.onecad-occt (S2 will install the pinned prefix here) ---"
          ls -la "$HOME/.onecad-occt" 2>/dev/null || echo "(absent — expected on a first run)"
          echo "--- ~/.cargo ---"
          ls -la "$HOME/.cargo" 2>/dev/null | head -10 || echo "(absent)"

          echo
          echo "=== checkout sanity ==="
          echo "HEAD           : $(git rev-parse HEAD)"
          echo "tracked files  : $(git ls-files | wc -l)"
          for f in scripts/build-pinned-occt.sh scripts/occt-fingerprint.sh \
                   scripts/build-worker.sh worker/CMakeLists.txt \
                   src-tauri/Cargo.toml bench/robustness/baselines/digests.json; do
            [ -e "$f" ] && echo "present: $f" || echo "MISSING: $f"
          done

          echo
          echo "=== report complete ==="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-environment-report
          path: runner-report
          if-no-files-found: warn
          retention-days: 30

  s2-occt:
    name: S2 — pinned OCCT 8.0.1
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && github.event_name == 'workflow_dispatch'
      && inputs.stage == 's2-occt'
    runs-on: [self-hosted, Linux, X64]
    # First build from source is 40-90 min at --parallel 3; a resumed or
    # already-installed prefix returns in seconds.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Disk guard
        # Source tree + build tree + install prefix need roughly 15 GB. Failing
        # here beats failing 70 minutes into a link step with ENOSPC.
        run: |
          set -euo pipefail
          avail_kb=$(df -Pk "$HOME" | awk 'NR==2 {print $4}')
          echo "available under $HOME: $((avail_kb / 1024 / 1024)) GiB"
          if [ "$avail_kb" -lt $((15 * 1024 * 1024)) ]; then
            echo "::error::need at least 15 GiB free to build OCCT from source"
            exit 1
          fi

      - name: Build pinned OCCT 8.0.1
        # ONECAD_OCCT_JOBS defaults to 3 (scripts/build-pinned-occt.sh:146),
        # which is the right ceiling here: 4 cores but only 8 GB of RAM, and
        # OCCT has translation units that peak well above 1 GB under gcc.
        run: |
          set -euo pipefail
          scripts/build-pinned-occt.sh \
            --version 8.0.1 \
            --prefix "$OCCT_PREFIX" \
            --build-dir "$OCCT_BUILD_DIR" \
            --build-id "$OCCT_PRIMARY_BUILD_ID"

      - name: Assert artifact provenance
        # The 16-hex runtime fingerprint (0a6a1dce34181289) comes from the
        # worker's own --selftest and is therefore asserted in S3. What IS
        # checkable here is the fingerprint's INPUT: source commit, build id and
        # the normalized effective option list. Expected values are read back
        # out of the script so this assertion cannot drift away from it.
        run: |
          set -euo pipefail
          python3 - "$OCCT_PREFIX/share/onecad/occt-build.json" <<'PY'
          import json, re, sys, pathlib

          meta = json.loads(pathlib.Path(sys.argv[1]).read_text())
          script = pathlib.Path("scripts/build-pinned-occt.sh").read_text()

          def literal(name):
              m = re.search(rf'^(?:readonly )?{name}="([^"]*)"', script, re.M)
              if not m:
                  sys.exit(f"cannot read {name} from build-pinned-occt.sh")
              return m.group(1)

          expected = {
              "version": "8.0.1",
              "tag": "V8_0_1",
              "sourceCommit": "b8f597c677811d1f9f4d8a97f5ae2825c0353a42",
              "normalizedBuildOptions": literal("NORMALIZED_OPTIONS"),
              "kernelPolicyVersion": int(literal("KERNEL_POLICY_VERSION")),
          }
          expected["buildId"] = __import__("os").environ["OCCT_PRIMARY_BUILD_ID"]

          print(json.dumps(meta, indent=2))
          bad = [f"{k}: expected {v!r}, got {meta.get(k)!r}"
                 for k, v in expected.items() if meta.get(k) != v]
          if bad:
              sys.exit("artifact provenance mismatch:\n  " + "\n  ".join(bad))
          print("provenance OK")
          PY

      - name: Prove the persistent prefix short-circuits
        # The whole point of installing outside the workspace: a second
        # invocation must reuse, not rebuild. If this ever rebuilds, every
        # later rung silently pays the 40-90 min tax again.
        run: |
          set -euo pipefail
          out=$(scripts/build-pinned-occt.sh \
            --version 8.0.1 \
            --prefix "$OCCT_PREFIX" \
            --build-dir "$OCCT_BUILD_DIR" \
            --build-id "$OCCT_PRIMARY_BUILD_ID")
          echo "$out"
          case "$out" in
            *"Reusing pinned OCCT"*) echo "short-circuit OK" ;;
            *) echo "::error::second invocation did not reuse the prefix"; exit 1 ;;
          esac

      - name: Report artifact
        if: always()
        run: |
          set +e
          out=occt-report
          mkdir -p "$out"
          exec > >(tee "$out/occt.txt") 2>&1
          echo "=== prefix ==="
          du -sh "$OCCT_PREFIX" 2>/dev/null
          ls -1 "$OCCT_PREFIX" 2>/dev/null
          echo
          echo "=== metadata ==="
          cat "$OCCT_PREFIX/share/onecad/occt-build.json" 2>/dev/null
          cat "$OCCT_PREFIX/share/onecad/occt-build.cmake" 2>/dev/null
          echo
          echo "=== libraries ==="
          ls -1 "$OCCT_PREFIX"/lib/libTK*.so* 2>/dev/null | head -20
          ls -1 "$OCCT_PREFIX"/lib/libTK*.so 2>/dev/null | wc -l
          echo
          echo "=== disk ==="
          du -sh "$OCCT_BUILD_DIR" "${OCCT_BUILD_DIR}-source" "${OCCT_BUILD_DIR}-downloads" 2>/dev/null
          df -h "$HOME" | tail -1
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occt-8.0.1-report
          path: occt-report
          if-no-files-found: warn
          retention-days: 30

  s3-worker:
    name: S3 — worker build + ctest
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && github.event_name == 'workflow_dispatch'
      && inputs.stage == 's3-worker'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require the S2 prefix
        run: |
          set -euo pipefail
          if [ ! -f "$OCCT_PREFIX/share/onecad/occt-build.cmake" ]; then
            echo "::error::no pinned OCCT at $OCCT_PREFIX — run stage s2-occt first"
            exit 1
          fi

      - name: Stdout hygiene gate
        run: scripts/check-worker-stdout-hygiene.sh

      - name: Configure worker
        # Mirrors ci.yml's worker-8-0-1 job. ONECAD_OCCT_BUILD_ID must match the
        # artifact metadata or CMakeLists fails loudly (worker/CMakeLists.txt:46).
        run: |
          set -euo pipefail
          cmake -S worker -B "$WORKER_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DONECAD_OCCT_ROOT="$OCCT_PREFIX" \
            -DONECAD_OCCT_VERSION=8.0.1 \
            -DONECAD_OCCT_BUILD_ID="$OCCT_PRIMARY_BUILD_ID" \
            -DONECAD_WORKER_BUILD_DIR="$WORKER_BUILD"

      - name: Build worker
        # `-k 0` keeps ninja going after the first failure. The step still fails,
        # but one run surfaces EVERY compile error instead of one per cycle —
        # which matters while porting to a second toolchain, where libstdc++
        # exposes transitive-include assumptions libc++ hid.
        run: cmake --build "$WORKER_BUILD" --parallel 3 -- -k 0

      - name: Selftest — version, build id, and the 16-hex fingerprint
        # This is the assertion S2 could not make: the fingerprint is computed at
        # runtime from occtVersion|sourceCommit|buildOptions|buildId|policy
        # (worker/CMakeLists.txt:60-61). Every term is platform-independent, so
        # macOS/arm64 and Linux/x86_64 must agree on 0a6a1dce34181289. If they do
        # not, the kernel identity is not portable and nothing downstream is
        # comparable across hosts.
        run: |
          set -euo pipefail
          set -o pipefail
          ONECAD_WORKER_LOG=debug "./$WORKER_BUILD/onecad-worker" --selftest 2>&1 \
            | tee worker-selftest.log
          grep -F "selftest OK (occt 8.0.1," worker-selftest.log
          grep -F "build ${OCCT_PRIMARY_BUILD_ID}," worker-selftest.log
          grep -F "fingerprint 0a6a1dce34181289" worker-selftest.log

      - name: Full worker suite
        run: ctest --test-dir "$WORKER_BUILD" --output-on-failure

      - name: Edge-op safety determinism
        run: |
          set -euo pipefail
          "./$WORKER_BUILD/tests/test_edge_op_failure" >edge-op-safety-a.ndjson
          "./$WORKER_BUILD/tests/test_edge_op_failure" >edge-op-safety-b.ndjson
          cmp edge-op-safety-a.ndjson edge-op-safety-b.ndjson

      - name: Report artifact
        if: always()
        run: |
          set +e
          out=worker-report
          mkdir -p "$out"
          cp worker-selftest.log "$out/" 2>/dev/null
          cp edge-op-safety-a.ndjson "$out/" 2>/dev/null
          ctest --test-dir "$WORKER_BUILD" -N >"$out/ctest-list.txt" 2>&1
          ldd "./$WORKER_BUILD/onecad-worker" >"$out/worker-ldd.txt" 2>&1
          ls -1 "$WORKER_BUILD"/onecad-* >"$out/binaries.txt" 2>&1
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-linux-report
          path: worker-report
          if-no-files-found: warn
          retention-days: 30

  s4-kernelbench:
    name: S4 — kernelbench T0 + cross-platform digest verdict
    if: >-
      github.repository == 'andrejvysny/OneCAD'
      && github.event_name == 'workflow_dispatch'
      && inputs.stage == 's4-kernelbench'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require the S3 runner binary
        run: |
          set -euo pipefail
          if [ ! -x "$WORKER_BUILD/onecad-kernelbench-runner" ]; then
            echo "::error::no kernelbench runner — run stage s3-worker first"
            exit 1
          fi

      - name: Rust toolchain (userland; no root needed)
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - name: Kernelbench unit + supervisor tests
        # Deliberately -p, not --workspace: the app crate's build script requires
        # a staged sidecar (bundle.externalBin) and pulls in GTK/WebKitGTK on
        # Linux. Neither is needed to exercise the benchmark supervisor.
        working-directory: src-tauri
        run: cargo test -p onecad-kernelbench

      - name: T0 campaign, both backends
        working-directory: src-tauri
        env:
          ONECAD_KERNELBENCH_RUNNER: /home/github-runner/worker-build/8.0.1/onecad-kernelbench-runner
        run: |
          set -euo pipefail
          mkdir -p "$KERNELBENCH_OUT"
          cargo run -p onecad-kernelbench -- \
            run --suite fillet/foundation --preset t0 --backend both \
            --out-dir "$KERNELBENCH_OUT/t0"
          cargo run -p onecad-kernelbench -- \
            report "$KERNELBENCH_OUT/t0/results.jsonl" \
            --json "$KERNELBENCH_OUT/t0/summary.json"

      - name: Cross-platform digest verdict
        # THE question this whole ladder exists to answer. The baselines in
        # bench/robustness/baselines/digests.json were recorded on macOS/arm64
        # and normalizedDigest quantizes to 1e-9; a different arch, libm and
        # compiler (gcc 14 here vs AppleClang there) may move a value past that.
        #
        # A digest difference is a FINDING, not a broken job: it says the
        # baselines must become platform-keyed. Only a tool-level error (exit 2
        # usage, exit 3 missing results) reds this step.
        run: |
          set -uo pipefail
          node scripts/kernelbench-manifest.mjs compare \
            "$KERNELBENCH_OUT/t0" "fillet/foundation:t0" \
            bench/robustness/baselines/digests.json \
            2>&1 | tee digest-compare.txt
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) verdict="MATCH — digests are identical across macOS/arm64 and Linux/x86_64; baselines stay global" ;;
            1) verdict="DIFFER — digests are platform-dependent; baselines must become platform-keyed" ;;
            *) echo "::error::compare tool failed with exit $rc (not a digest difference)"; exit "$rc" ;;
          esac
          echo "VERDICT: $verdict"
          {
            echo "## S4 cross-platform digest verdict"
            echo
            echo "$verdict"
            echo
            echo '```'
            head -40 digest-compare.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || echo "::warning::$verdict"

      - name: Report artifact
        if: always()
        run: |
          set +e
          out=kernelbench-report
          mkdir -p "$out"
          cp "$KERNELBENCH_OUT/t0/results.jsonl" "$out/" 2>/dev/null
          cp "$KERNELBENCH_OUT/t0/summary.json" "$out/" 2>/dev/null
          cp digest-compare.txt "$out/" 2>/dev/null
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernelbench-t0-linux
          path: kernelbench-report
          if-no-files-found: warn
          retention-days: 30
