# Socket Head Cap Screw — a built-in generator package (Component Library spec §2.1/§6.2).
#
# Cylindrical head with a hex socket (the socket itself is not modeled —
# invisible at assembly scale, like a cosmetic thread).
#
# Geometry is produced by the worker's `iso4762` generator from its own dimension
# table; this manifest declares identity, metadata and the parameter/attachment
# signature only — never a dimension. A size outside `thread.domain` is refused
# loudly by the generator, never substituted (spec §0 invariant 4).
#
# `revision` is the package content hash over every file EXCEPT this manifest
# (spec §2.1). A generator package carries no other file, so the hash is the
# SHA-256 of nothing — the same value for every seed package here, correct
# rather than coincidental, and pinned by a test in `src-tauri/src/library.rs`.

[identity]
id = "onecad.std.iso4762"
version = "1.0.0"
revision = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[metadata]
name = "Socket Head Cap Screw"
standard = "ISO 4762"
designation = "ISO 4762 {thread}x{length}"
category = ["fasteners", "screws"]
tags = ["metric", "shcs", "socket", "din912"]
unit = "mm"

[source]
kind = "generator"
generator = "iso4762"
generator_version = 1

[parameters]
thread = { role = "free", key = "M6", domain = ["M2", "M2.5", "M3", "M4", "M5", "M6", "M8", "M10", "M12"] }
length = { role = "free", value = 20, snap = "preferred", min = 2 }
thread_detail = { role = "free", value = "cosmetic", domain = ["cosmetic", "simplified", "modeled"] }

[attachments]
# The generator seats the head underside at the local origin with the shank
# running down -Z (see ComponentGenerators.h), which is what makes a drop on a
# hole rim drive the shank INTO the hole.
head_seat = { on = "face:head_underside", accepts = ["plane"] }
shank_axis = { on = "cylinder:shank", accepts = ["cylinder", "hole", "circularEdge"] }
