# Plain Washer — a built-in generator package (Component Library spec §2.1/§6.2).
#
# Normal series. Sized by the THREAD it serves, not by its own bore — an M6
# washer has a 6.4 mm hole (spec §6.1). No length and no thread_detail.
#
# Geometry is produced by the worker's `iso7089` generator from its own dimension
# table; this manifest declares identity, metadata and the parameter/attachment
# signature only — never a dimension. A size outside `thread.domain` is refused
# loudly by the generator, never substituted (spec §0 invariant 4).
#

[identity]
id = "onecad.std.iso7089"
version = "1.0.1"
revision = "sha256v2:2e2666f05ab8e8899bff9de8f12d516d4d69f033f3000d939154d73a574f05c5"

[metadata]
name = "Plain Washer"
standard = "ISO 7089"
designation = "ISO 7089 {thread}"
category = ["fasteners", "washers"]
tags = ["metric", "washer", "normal-series", "din125"]
unit = "mm"

[source]
kind = "generator"
generator = "iso7089"
generator_version = 1

[parameters]
thread = { role = "free", value = "M6", domain = ["M2", "M2.5", "M3", "M4", "M5", "M6", "M8", "M10", "M12"] }

[attachments]
# The generator seats the bearing face at the local origin with the part
# occupying +Z (see ComponentGenerators.h), so it sits ON the surface it is
# dropped onto; the bore runs along Z.
bore_axis = { on = "cylinder:bore", accepts = ["cylinder", "hole", "circularEdge"] }
seat = { on = "face:bearing", accepts = ["plane"] }
