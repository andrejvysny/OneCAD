# Hex Nut — a built-in generator package (Component Library spec §2.1/§6.2).
#
# No length and no thread_detail: a nut has neither. Its internal thread is
# cosmetic (a plain bore at the nominal diameter); the corner chamfer is not
# modeled.
#
# Geometry is produced by the worker's `iso4032` generator from its own dimension
# table; this manifest declares identity, metadata and the parameter/attachment
# signature only — never a dimension. A size outside `thread.domain` is refused
# loudly by the generator, never substituted (spec §0 invariant 4).
#

[identity]
id = "onecad.std.iso4032"
version = "1.0.1"
revision = "sha256v2:636d6aec2701cf1cf074be489aff1b647f8b46c5e800a01220c2277fb3384f09"

[metadata]
name = "Hex Nut"
standard = "ISO 4032"
designation = "ISO 4032 {thread}"
category = ["fasteners", "nuts"]
tags = ["metric", "hex", "din934"]
unit = "mm"

[source]
kind = "generator"
generator = "iso4032"
generator_version = 1

[parameters]
thread = { role = "free", value = "M6", domain = ["M2", "M2.5", "M3", "M4", "M5", "M6", "M8", "M10", "M12"] }

[attachments]
# The generator seats the bearing face at the local origin with the part
# occupying +Z (see ComponentGenerators.h), so it sits ON the surface it is
# dropped onto; the bore runs along Z.
bore_axis = { on = "cylinder:bore", accepts = ["cylinder", "hole", "circularEdge"] }
seat = { on = "face:bearing", accepts = ["plane"] }
